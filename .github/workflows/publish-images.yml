name: Publish Images

# Builds and pushes both images the homelab k3s2 deployment pulls. main now
# carries the homelab patches directly (PR #1 merged), so this watches main
# plus any v*-homelab release tag; ci.yml (push: false) still covers plain
# build verification on every push/PR.
#
# Pushes to main still BUILD -- they just no longer produce a floating :main
# tag. Every published ref is immutable; see the tags block below.
on:
  push:
    branches: [main]
    tags: ["v*-homelab"]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-backend
          # No type=ref,event=branch. A floating :main (and :homelab) tag that
          # silently repoints on every push is exactly what the consuming repo's
          # pinning policy exists to avoid -- np-home-homelab pins these images
          # by immutable digest, so a moving tag is at best noise and at worst a
          # trap for anyone who copies it. Immutable refs only: the short commit
          # SHA, plus v*-homelab release tags.
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          # No type=ref,event=branch. A floating :main (and :homelab) tag that
          # silently repoints on every push is exactly what the consuming repo's
          # pinning policy exists to avoid -- np-home-homelab pins these images
          # by immutable digest, so a moving tag is at best noise and at worst a
          # trap for anyone who copies it. Immutable refs only: the short commit
          # SHA, plus v*-homelab release tags.
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
